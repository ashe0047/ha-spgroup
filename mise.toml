[tools]
python = "3.14.2"

[tasks."python:install"]
description = "Install Python scaffold dependencies for HA 2026.7.2"
run = """
python -m venv --clear .venv
.venv/bin/python -m pip install -U pip
.venv/bin/python -m pip install -e ../../../python-packages/spgroup pytest==9.0.0 pytest-asyncio==1.3.0 ruff==0.15.21 mypy==2.3.0 homeassistant==2026.7.2 home-assistant-frontend==20260624.5 ha-ffmpeg==3.2.2 hassil==3.8.0 PyTurboJPEG==1.8.3 mutagen==1.47.0 home-assistant-intents pymicro-vad pyspeex-noise==1.0.2 aiohasupervisor rf-protocols infrared-protocols coverage==7.10.6 freezegun==1.5.2 license-expression==30.4.3 mock-open==1.4.0 paho-mqtt==2.1.0 pipdeptree==2.26.1 pydantic==2.12.2 pylint-per-file-ignores==1.4.0 pytest-aiohttp==1.1.0 pytest-cov==7.0.0 pytest-freezer==0.4.9 pytest-github-actions-annotate-failures==0.3.0 pytest-picked==0.5.1 pytest-socket==0.7.0 pytest-sugar==1.0.0 pytest-timeout==2.4.0 pytest-unordered==0.7.0 pytest-xdist==3.8.0 requests-mock==1.12.1 respx==0.22.0 syrupy==5.0.0 tqdm==4.67.1 unidiff
.venv/bin/python -m pip install --no-deps pytest-homeassistant-custom-component==0.13.346
"""

[tasks."python:test"]
description = "Run Python tests"
run = "python -m pytest tests/"

[tasks."python:test:ha-live-soak"]
description = "Run opt-in live SP Group Home Assistant runtime soak"
run = "SPGROUP_HA_LIVE_SOAK=1 python -m pytest tests/components/sp_group/test_live_soak.py -m spgroup_ha_live_soak -vv -rs"

[tasks."ha:dev"]
description = "Start HA dev (Python 3.14, HA 2026.7.2)"
run = "python scripts/ha_dev.py"

[tasks."ha:dev:reset"]
description = "Reset config & start HA dev (Python 3.14, HA 2026.7.2)"
run = "HA_DEV_RESET=1 python scripts/ha_dev.py"

[tasks."ha:dev:cached-session"]
description = "Start HA dev (Python 3.14, HA 2026.7.2) with cached session bypass"
run = "SPGROUP_HA_DEV_AUTH_BYPASS=1 SPGROUP_HA_DEV_SESSION_FILE=.runtime/mobile-session.json python scripts/ha_dev.py"

[tasks."ha:dev:cached-session:reset"]
description = "Reset config & start HA dev (Python 3.14, HA 2026.7.2) cached session bypass"
run = "HA_DEV_RESET=1 SPGROUP_HA_DEV_AUTH_BYPASS=1 SPGROUP_HA_DEV_SESSION_FILE=.runtime/mobile-session.json python scripts/ha_dev.py"

[tasks."ha:dev:cached-session:poll-gap"]
description = "Start HA dev with controlled post-seed poll-gap mode"
run = "SPGROUP_HA_DEV_AUTH_BYPASS=1 SPGROUP_HA_DEV_SESSION_FILE=.runtime/mobile-session.json SPGROUP_HA_DEV_SKIP_INITIAL_BACKFILL=1 python scripts/ha_dev.py"

[tasks."ha:dev:cached-session:poll-gap:reset"]
description = "Reset config & start HA dev with controlled post-seed poll-gap mode"
run = "HA_DEV_RESET=1 SPGROUP_HA_DEV_AUTH_BYPASS=1 SPGROUP_HA_DEV_SESSION_FILE=.runtime/mobile-session.json SPGROUP_HA_DEV_SKIP_INITIAL_BACKFILL=1 python scripts/ha_dev.py"

[tasks."ha:dev:refresh-session"]
description = "Dev-only: refresh .runtime/mobile-session.json access token"
run = "SPGROUP_HA_DEV_SESSION_FILE=.runtime/mobile-session.json python scripts/ha_dev_refresh_session.py"

[tasks."ha:dev:force-statistics"]
description = "Dev-only: force HA Recorder statistics and SP Group statistics import"
run = "python scripts/ha_dev_force_statistics.py"

[tasks."ha:dev:prepare-poll-gap:electric"]
description = "Dev-only: arm an empty electricity ledger for a post-seed poll-gap test"
run = "python scripts/ha_dev_sp_group_service.py prepare_poll_gap electric"

[tasks."ha:dev:prepare-poll-gap:water"]
description = "Dev-only: arm an empty water ledger for a post-seed poll-gap test"
run = "python scripts/ha_dev_sp_group_service.py prepare_poll_gap water"

[tasks."ha:dev:poll-now:electric"]
description = "Dev-only: run one normal electricity poll"
run = "python scripts/ha_dev_sp_group_service.py poll_now electric"

[tasks."ha:dev:poll-now:water"]
description = "Dev-only: run one normal water poll"
run = "python scripts/ha_dev_sp_group_service.py poll_now water"

[tasks."ha:dev:ami-latest:electric"]
description = "Dev-only: find latest usable electricity AMI bucket and test timestamps"
run = "python scripts/ha_dev_ami_latest.py"

[tasks."python:lint"]
description = "Run Python lint and type checks"
run = "python -m ruff check custom_components tests && python -m mypy -p custom_components.sp_group"

[tasks."docs:check"]
description = "Validate documentation lifecycle headings and local links"
run = "python scripts/check_docs.py"

[tasks."ha:check"]
description = "Run lightweight Home Assistant scaffold checks"
run = "python -m compileall custom_components/sp_group tests"
